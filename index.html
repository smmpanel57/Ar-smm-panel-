<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Panel Client</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; }
        h2 { text-align: center; color: #38bdf8; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button:hover { background: #0369a1; }
        #response { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>SMM Order Panel</h2>
    
    <label for="service">Select Service:</label>
    <select id="service">
        <option value="">Loading services...</option>
    </select>

    <label for="link">Target Link:</label>
    <input type="text" id="link" placeholder="https://facebook.com/your-page">

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" placeholder="1000">

    <button onclick="submitOrder()">Submit Order</button>

    <div id="response"></div>
</div>

<script>
    // Firebase Cloud Function Endpoint URL (Deploy korar por je URL paben)
    const GET_SERVICES_URL = "https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/getServices";
    const CREATE_ORDER_URL = "https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/createOrder";

    // Service list load kora
    async function loadServices() {
        try {
            const res = await fetch(GET_SERVICES_URL);
            const services = await res.json();
            const select = document.getElementById("service");
            select.innerHTML = "";
            services.forEach(item => {
                let opt = document.createElement("option");
                opt.value = item.service;
                opt.innerText = `${item.name} - $${item.rate}`;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error("Error loading services", e);
        }
    }

    // Order Submit kora
    async function submitOrder() {
        const service = document.getElementById("service").value;
        const link = document.getElementById("link").value;
        const quantity = document.getElementById("quantity").value;
        const respDiv = document.getElementById("response");

        if(!service || !link || !quantity) {
            alert("Sokol information puron korun!");
            return;
        }

        respDiv.style.display = "block";
        respDiv.style.background = "#334155";
        respDiv.innerText = "Processing order...";

        try {
            const res = await fetch(CREATE_ORDER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ service, link, quantity })
            });
            const data = await res.json();
            
            if(data.order) {
                respDiv.style.background = "#15803d";
                respDiv.innerText = "Order Successful! Order ID: " + data.order;
            } else {
                respDiv.style.background = "#b91c1c";
                respDiv.innerText = "Failed: " + JSON.stringify(data);
            }
        } catch (e) {
            respDiv.style.background = "#b91c1c";
            respDiv.innerText = "Error submitting order.";
        }
    }

    loadServices();
</script>

</body>
</html>
